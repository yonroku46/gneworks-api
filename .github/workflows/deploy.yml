name: Deploy API to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Java 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # 2. Gradle 빌드
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 3. 빌드된 JAR 파일을 서버로 전송 (SCP)
      - name: Transfer JAR to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "build/libs/gnework-0.0.1.jar"
          target: "/home/app-service/app-api/jar"
          strip_components: 2

      # 4. 프로퍼티 파일 내 시크릿 주입 및 서버 전송 (application-prod.yml)
      - name: Inject AWS Secret Key into application-prod.yml
        env:
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          python3 -c "
          import os
          key = os.environ.get('AWS_SECRET_KEY', '')
          path = 'src/main/resources/application-prod.yml'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.replace('\${AWS_SECRET_KEY:}', key)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Transfer Property to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "src/main/resources/application-prod.yml"
          target: "/home/app-service/app-api/property"
          strip_components: 3

      # 5. deploy.sh 실행 (SSH)
      - name: Execute deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo bash /home/app-service/app-api/deploy.sh
